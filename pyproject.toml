[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-gaze-estimation"
dynamic = ["version"]
description = "Open Implementations for Gaze Estimation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Elorfiniel", email = "markgenthusiastic@gmail.com"},
]
keywords = ["computer vision", "gaze estimation", "eye tracking"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# Version bounds target Python 3.10 - 3.14. torch floor 2.9.0: first release
# with cp314 wheels and cu130 GPU wheels for cp310 - cp314 (win/linux).
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.14,<4",
  "kornia>=0.8.0,<0.9",
  "kornia-rs>=0.1.8,<0.2",
  "matplotlib>=3.10,<4",
  "loguru>=0.7.3,<0.8",
  "mmengine>=0.10.4,<0.11",
  "numpy>=2.2,<3",
  "opencv-contrib-python>=4.12,<6",
  "onnx>=1.19,<2",
  "onnxruntime>=1.22,<2",
  "pandas>=2.3,<3",
  "pillow>=12,<13",
  "scikit-image>=0.25,<0.26",
  "scikit-learn>=1.7,<2",
  "tensorboard>=2.20,<3",
  "timm>=1.0.16,<2",
  "torch>=2.9.0,<2.15",
  "torchinfo>=1.8,<2",
  "torchvision>=0.24.0,<0.30",
  "mediapipe>=0.10.14,<0.11; python_version < '3.13'",
  "mediapipe>=0.10.30,<2; python_version >= '3.13'",
  "seaborn>=0.13,<0.14",
]

[project.optional-dependencies]
# Extra dependencies for CLIP image encoder and UniGaze
extra = [
  # CLIP (OpenAI), used by UniGaze as the image encoder
  "ftfy>=6.3,<7",
  "wcwidth>=0.2,<0.3",
  "clip @ git+https://github.com/openai/CLIP.git",
  # unigaze is not listed as a dependency: its metadata pins timm==0.3.2,
  # which conflicts with the timm>=1.0.16 required above.
  # Install it manually with: uv pip install --no-deps unigaze==0.1.3
]

[tool.setuptools.dynamic]
version = {attr = "opengaze.version.__version__"}

[tool.setuptools.packages.find]
include = ["opengaze*"]

[tool.uv]
# torch-backend (GPU auto-detection, see README) requires uv >= 0.9
required-version = ">=0.9"
